[discovery_extension_definition]
short_name = "honetlabs.docker_container_monitor"
section = "app"
name = "Docker Container Monitoring"
version = "1.0.0"
description = "Agentless Docker monitoring over SSH and docker.sock. One Pandora agent per host, automatic container resource and state modules."
execution_file[_exec1_] = "pandorafms_docker.py"
exec[] = "/usr/bin/python3 '_exec1_' --config '_configFile_' --outdir '__incomingDir__' --lock-file '/tmp/pandorafms-docker-__taskMD5__.lock'"
default_value[_mode_] = "ssh"
default_value[_host_] = ""
default_value[_sshPort_] = 22
default_value[_sshUser_] = ""
default_value[_sshKey_] = ""
default_value[_socket_] = "/var/run/docker.sock"
default_value[_agent_] = ""
default_value[_nameFilter_] = ""
default_value[_maxContainers_] = 30
default_value[_includeStopped_] = true
default_value[_collectStats_] = true
default_value[_networkRates_] = true
default_value[_interval_] = 300
default_value[_apiTimeout_] = 8
default_value[_sshTimeout_] = 120
default_value[_overlap_] = true
default_value[_stateDir_] = ""

[config_steps]
name[1] = "Docker Host"
custom_fields[1] = "docker_target"
fields_columns[1] = 2
name[2] = "Containers and modules"
custom_fields[2] = "docker_monitoring"
fields_columns[2] = 2
name[3] = "Execution and performance"
custom_fields[3] = "docker_advanced"
fields_columns[3] = 2

[tempfile_confs]
file[_configFile_] = "mode=_mode_\nhost=_host_\nssh_port=_sshPort_\nssh_user=_sshUser_\nssh_key=_sshKey_\nsocket=_socket_\nagent=_agent_\ngroup=_group_\nname_regex=_nameFilter_\nmax_containers=_maxContainers_\ninclude_stopped=_includeStopped_\ncollect_stats=_collectStats_\nnetwork_rates=_networkRates_\ninterval=_interval_\napi_timeout=_apiTimeout_\nssh_timeout=_sshTimeout_\noverlap_protection=_overlap_\nstate_dir=_stateDir_"

[docker_target]
macro[1] = _mode_
name[1] = "Connection mode"
type[1] = select
select_data[1] = docker_modes
macro[2] = _host_
name[2] = "Docker Host / IP"
type[2] = string
placeholder[2] = "172.17.8.131"
macro[3] = _sshPort_
name[3] = "SSH port"
type[3] = number
macro[4] = _sshUser_
name[4] = "SSH username with Docker socket access"
type[4] = string
placeholder[4] = "docker-monitor"
required_field[4] = false
mandatory_field[4] = false
macro[5] = _sshKey_
name[5] = "SSH private key path on Pandora server"
type[5] = string
placeholder[5] = "/etc/pandora/ssh/docker_monitor_key"
required_field[5] = false
mandatory_field[5] = false
macro[6] = _socket_
name[6] = "Docker Unix socket path"
type[6] = string
placeholder[6] = "/var/run/docker.sock"
macro[7] = _agent_
name[7] = "Pandora Agent name (one per Docker Host)"
type[7] = string
placeholder[7] = "DOCKER-172.17.8.131"
required_field[7] = false
mandatory_field[7] = false
macro[8] = _group_
name[8] = "Pandora Agent group"
type[8] = select
select_data[8] = agent_groups

[docker_modes]
option[ssh] = "SSH (recommended for remote Docker Host)"
option[local] = "Local Unix socket (Pandora Server is Docker Host)"

[docker_monitoring]
macro[1] = _includeStopped_
name[1] = "Discover stopped containers"
type[1] = checkbox
macro[2] = _collectStats_
name[2] = "Collect CPU, memory, network and disk metrics"
type[2] = checkbox
macro[3] = _networkRates_
name[3] = "Calculate network throughput (Mbps)"
type[3] = checkbox
macro[4] = _maxContainers_
name[4] = "Maximum containers per execution"
type[4] = number
macro[5] = _nameFilter_
name[5] = "Container name filter (optional Python regex)"
type[5] = string
placeholder[5] = "^(nginx|mysql|redis)"
required_field[5] = false
mandatory_field[5] = false

[docker_advanced]
macro[1] = _interval_
name[1] = "Pandora Agent interval (seconds)"
type[1] = number
macro[2] = _apiTimeout_
name[2] = "Docker API request timeout (seconds)"
type[2] = number
macro[3] = _sshTimeout_
name[3] = "SSH collector timeout (seconds)"
type[3] = number
macro[4] = _overlap_
name[4] = "Prevent overlapping task executions"
type[4] = checkbox
macro[5] = _stateDir_
name[5] = "Local cache directory for network rates (optional)"
type[5] = string
placeholder[5] = "~/.cache/pandora-docker-discovery"
required_field[5] = false
mandatory_field[5] = false
